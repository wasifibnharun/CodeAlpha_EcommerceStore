{% extends "base.html" %}
{% block title %}Log in | NovaMart{% endblock %}
{% block content %}<section class="auth-shell"><div><p class="eyebrow">Welcome back</p><h1>Log in</h1></div><form method="post" class="form-card">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="button full">Log in</button><p>New here? <a href="{% url 'register' %}">Create an account</a>.</p></form></section>{% endblock %}
