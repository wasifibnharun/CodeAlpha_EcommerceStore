services:
  - type: web
    name: codealpha-ecommerce-store
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codealpha-ecommerce-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "3600"

databases:
  - name: codealpha-ecommerce-db
    plan: free
    region: singapore
    databaseName: codealpha_ecommerce
    user: codealpha_ecommerce
